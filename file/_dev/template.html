<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>engine test</title>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
            "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}
</script>
<style>
  body { font: 13px/1.4 ui-monospace, Menlo, monospace; margin: 16px; }
  #log { white-space: pre-wrap; border: 1px solid #aaa; padding: 8px; min-height: 200px; }
  .ok { color: #050; } .err { color: #a00; }
</style>
</head>
<body>
<h1>engine test</h1>
<p><input type="file" id="pick" multiple> <button id="run">Run</button></p>
<div id="log"></div>
<script type="module">
  const logEl = document.getElementById('log');
  window.log = (msg, cls = '') => {
    const line = document.createElement('div');
    line.className = cls;
    line.textContent = typeof msg === 'string' ? msg : JSON.stringify(msg);
    logEl.appendChild(line);
    console.log(msg);
  };
  window.results = {};                       // stash outputs here for inspection

  // Load a sample from file/_dev/samples/ as a File object.
  window.sample = async (name, type = '') => {
    const res = await fetch(`/file/_dev/samples/${name}?v=${Date.now()}`);
    if (!res.ok) throw new Error(`sample ${name}: HTTP ${res.status}`);
    return new File([await res.blob()], name, { type });
  };

  // First 64 bytes, as the UI hands them to detect().
  window.head = async (file) => new Uint8Array(await file.slice(0, 64).arrayBuffer());

  // Cache-busted engine import.
  window.engine = (name) => import(`../engines/${name}.js?v=${Date.now()}`);

  document.getElementById('run').addEventListener('click', async () => {
    try {
      const eng = await engine('REPLACE_ME');
      log(`formats: ${eng.formats.map(f => f.id + (f.read ? 'r' : '') + (f.write ? 'w' : '')).join(' ')}`);
      for (const file of document.getElementById('pick').files) {
        const id = eng.detect(file, await head(file));
        log(`${file.name} -> detect: ${id}`);
      }
    } catch (e) { log(String(e.stack || e), 'err'); }
  });
</script>
</body>
</html>
